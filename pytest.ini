[pytest]
# Pytest configuration file

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Asyncio mode
asyncio_mode = auto

# Test paths
testpaths = tests

# Minimum version
minversion = 7.0

# Output options
addopts =
    --verbose
    --strict-markers
    --tb=short
    --disable-warnings
    -ra
    # Parallel execution - adjust -n based on CPU cores
    # -n auto uses all available cores
    # -n 4 uses 4 workers (optimal for this test suite)
    # Remove or comment out for debugging
    -n 4
    # Distribute tests by file for better load balancing
    --dist loadfile

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    auth: marks tests related to authentication
    sensors: marks tests related to sensor management
    records: marks tests related to sensor records

# Filter warnings to reduce noise
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:asyncio

# Coverage options (if using pytest-cov)
# Uncomment to enable coverage reporting
# addopts = --cov=app --cov-report=html --cov-report=term-missing

# Ignore patterns
# python_ignore =
#     migrations/*
#     alembic/*

